name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"

jobs:
  secrets-scan:
    name: Secret Detection (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run the gitleaks binary directly — matches what the pre-commit hook does
      # and reliably picks up the repo's .gitleaks.toml allowlist. The official
      # gitleaks-action@v2 uses a "partial scan" mode that fails with
      # `stderr is not empty` on initial pushes and doesn't honor the config file.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks --version
      - name: Scan
        run: gitleaks detect --no-banner --redact --config .gitleaks.toml --exit-code 1

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Gemini audit: upgraded from --audit-level=high to moderate
      - run: npm audit --audit-level=moderate
